<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/style.css?v=260714b" />
    <script src="/adoff-i18n.js?v=260718-fix"></script>
    <style>
        body {
            background: #0a0a1a;
            color: #e2e2f0;
            font-family: Inter, system-ui, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 16px 0;
            font-weight: 700;
        }
        p {
            color: #9090a0;
            margin: 0 0 32px 0;
            line-height: 1.6;
        }
        .cta-group {
            margin-bottom: 48px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            margin: 0 6px 12px 6px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e2f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-primary {
            background: #7c5cfc;
            color: #ffffff;
            border: 1px solid transparent;
        }
        .useful-links {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 32px;
        }
        .useful-links h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #9090a0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .links-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .links-list a {
            color: #e2e2f0;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .links-list a:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container">
            <h1><span data-i18n="notfound.title">Pagina non trovata</span></h1>
            <p><span data-i18n="notfound.message">La pagina che cerchi non esiste o è stata spostata.</span></p>

            <div class="cta-group">
                <a href="/" class="btn" data-i18n="notfound.cta.home">Torna alla homepage</a>
                <a href="/install.html" class="btn btn-primary" data-i18n="notfound.cta.install">Installa AdOff</a>
            </div>

            <div class="useful-links">
                <h2><span data-i18n="notfound.useful">Link utili</span></h2>
                <div class="links-list">
                    <a href="/pricing.html">Prezzi</a>
                    <a href="/guide.html">Guida</a>
                    <a href="/support.html">Supporto</a>
                    <a href="/community">Community</a>
                    <a href="/blog/">Blog</a>
                </div>
            </div>
        </div>
    </main>

    <script src="/adoff-nav.js"></script>
    <script src="/adoff-footer.js"></script>
</body>
</html>

      - generic [ref=f1e165]:
        - heading "Panoramica" [level=2] [ref=f1e167]
        - generic [ref=f1e169]:
          - generic [ref=f1e170]:
            - paragraph [ref=f1e171]: Ads? Off! Blocca pubblicita' su tutti i siti. Invisibile. Leggero. Veloce.
            - paragraph [ref=f1e172]: "A faster, cleaner, more private web. AdOff is a privacy-focused content filter built from scratch with Manifest V3. It removes intrusive ads, trackers, and clutter everywhere — instantly, invisibly, and without slowing down your browser. ━━━━━━━━━━━━━━━━━━━━ HOW IT WORKS ━━━━━━━━━━━━━━━━━━━━ AdOff uses independent layers of protection that work together: ● Network Filtering — Intercepts unwanted network requests before they load, using Chrome's native declarativeNetRequest API. 138 static rules cover known tracking domains, intrusive scripts, and unwanted content delivery networks. Zero background overhead. ● Cosmetic Filtering — Hides intrusive page elements such as banners, pop-ups, cookie walls, overlay content, and video interruptions using precise CSS selectors and smart DOM scanning, without breaking page layouts. ● Stealth Mode (Pro) — Advanced anti-detection technology. AdOff stays invisible to scripts that try to detect content filters, so you never see \"please disable your content filter\" messages, even on sites that fight filtering. ━━━━━━━━━━━━━━━━━━━━ KEY FEATURES ━━━━━━━━━━━━━━━━━━━━ ✔ Works on every website — no configuration, no lists to manage ✔ Ultra-lightweight: only tens of KB, a fraction of typical alternatives ✔ Stealth mode (Pro): invisible to detection systems ✔ Per-site controls: pause on specific sites with one click ✔ 4 pause modes: 1 hour, until tomorrow, permanently, or custom ✔ Whitelist management: easily allow sites you want to support ✔ Real-time stats: see how much has been blocked ✔ Cookie banner blocker: auto-dismisses consent pop-ups ✔ Blocks everything by default — no \"acceptable\" exceptions, no paid whitelist ✔ Transparent pricing: cancel anytime, 30-day money-back guarantee, no hidden auto-renewal ✔ Privacy-first: no browsing history collected, no page content read, no tracking data sent ✔ 15 languages ✔ Manifest V3: latest extension architecture ✔ Free tier available — core protection at no cost ━━━━━━━━━━━━━━━━━━━━ FREE vs PRO ━━━━━━━━━━━━━━━━━━━━ Free — Full network filtering, cosmetic filtering, per-site pause, whitelist, multi-language support. Pro — Everything in Free, plus Stealth anti-detection mode, advanced filtering, priority updates, and early access to new features. Start with a 30-day free trial. ━━━━━━━━━━━━━━━━━━━━ WHY ADOFF? ━━━━━━━━━━━━━━━━━━━━ → Blocks everything by default — no \"acceptable\" exceptions slipping through, no paid whitelist. → Zero configuration — works the second you install it, no modes to switch, no lists to tune. → Ultra-light — uses Chrome's native engine, no background overhead, no slowdown. → Transparent pricing — cancel anytime, 30-day money-back guarantee, no hidden auto-renewal traps. → Invisible by design — stays undetected even where filtering is actively blocked. → No monetization of your data — we don't track you, sell your data, or inject our own content. ━━━━━━━━━━━━━━━━━━━━ SUPPORT ━━━━━━━━━━━━━━━━━━━━ Need help? Visit our support page at adoff.app/support — we respond to every message."

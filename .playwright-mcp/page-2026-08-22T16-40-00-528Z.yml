            - listitem [ref=f6e141]: Systemweites Werbeblocking über Desktop-App
            - listitem [ref=f6e142]: DNS-Level-Blocking für netzwerkweiten Schutz
            - listitem [ref=f6e143]: Polierte, einsteigerfreundliche Oberfläche
            - listitem [ref=f6e144]: Gute MV3-Implementierung für die Browser-Erweiterung
            - listitem [ref=f6e145]: Kindersicherung im Premium-Tarif
        - generic [ref=f6e146]:

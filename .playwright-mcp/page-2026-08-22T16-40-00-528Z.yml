    - heading "5. AdBlock Plus , Der Klassiker" [level=2] [ref=f6e187]
    - generic [ref=f6e188]:
      - generic [ref=f6e189]: "5"
      - generic [ref=f6e190]:
        - generic [ref=f6e191]: "5"
        - generic [ref=f6e192]:
          - generic [ref=f6e193]: AdBlock Plus
          - generic [ref=f6e194]: Das Original · Acceptable-Ads-Kontroverse · Hohe Installationszahlen
      - generic [ref=f6e195]: ★★☆☆☆ 2,8 / 5
      - paragraph [ref=f6e196]: AdBlock Plus ist der meistinstallierte Werbeblocker in der Geschichte – hauptsächlich, weil er der erste war und weil er auf vielen Browser-Download-Seiten als Standard oder empfohlene Erweiterung angeboten wird. Namensbekanntheit bringt Nutzer zurück. Aber Bekanntheit allein macht ihn nicht zur besten Wahl für 2026.
      - paragraph [ref=f6e197]:
        - text: Die entscheidende Kontroverse rund um AdBlock Plus ist sein
        - strong [ref=f6e198]: Acceptable-Ads
        - text: "-Programm. Standardmäßig blockiert ABP keine Anzeigen von Unternehmen, die für eine Whitelist-Aufnahme bezahlt haben – darunter einige der weltgrößten Werbenetzwerke. Die Begründung lautet, dass „akzeptable\" (nicht-aufdringliche) Anzeigen Inhaltsersteller finanzieren helfen. Das Gegenargument: Nutzer installieren einen Werbeblocker, um Werbung zu blockieren, und Werbetreibende für Whitelist-Zugang zu bezahlen, ist ein direkter Interessenkonflikt. Du kannst Acceptable Ads in den Einstellungen deaktivieren, was die Blockiereffektivität deutlich verbessert – aber das erfordert eine bewusste Aktion, und viele Nutzer ändern die Standardeinstellung nie."
      - paragraph [ref=f6e199]: Die technische Leistung liegt im Vergleich zu modernen Mitbewerbern unterdurchschnittlich. In unseren Tests blockierte ABP mit Standardeinstellungen etwa 62 % der Werbeanzeigen – eine der niedrigsten Raten in unserer Gruppe. Mit deaktiviertem Acceptable Ads verbesserte sich das auf rund 84 %, aber immer noch hinter den Spitzenreitern. Die CPU-Auslastung war die höchste aller getesteten Erweiterungen.
      - generic [ref=f6e200]:
        - generic [ref=f6e201]:
          - generic [ref=f6e202]: Vorteile
          - list [ref=f6e203]:

    - heading "4. Ghostery , Bester für Tracker-Einblicke" [level=2] [ref=f6e156]
    - generic [ref=f6e157]:
      - generic [ref=f6e158]: "4"
      - generic [ref=f6e159]:
        - generic [ref=f6e160]: "4"
        - generic [ref=f6e161]:
          - generic [ref=f6e162]: Ghostery
          - generic [ref=f6e163]: Datenschutzorientiert · Tracker-Analyse · MV3-kompatibel
      - generic [ref=f6e164]: ★★★☆☆ 3,6 / 5
      - paragraph [ref=f6e165]: "Ghosterys ursprüngliche Nische war Transparenz: Es zeigte dir, welche Tracker auf einer Seite vorhanden sind, kategorisierte sie und ließ dich sie einzeln blockieren oder erlauben. Diese Mission ist auch 2026 der Kern des Produkts. Wenn du verstehen möchtest, wer dich verfolgt – nicht nur blind blockieren –, bietet Ghosterys Tracker-Aufschlüsselung und „Insights\"-Panel ein Detailniveau, das keine andere Erweiterung in dieser Liste erreicht."
      - paragraph [ref=f6e166]: Als reiner Werbeblocker ist Ghostery jedoch weniger effektiv als die Top-Kandidaten. In unseren Praxistests blockierte es etwa 78 % der Werbeanzeigen auf Testseiten, verglichen mit 95 %+ bei AdOff und dem vollständigen uBlock Origin. Die MV3-Migration wurde kompetent gemeistert, und Ghostery hat eine saubere Oberfläche, die leicht zu navigieren ist. Der Leistungseinfluss war minimal.
      - paragraph [ref=f6e167]: "Die Geschichte des Unternehmens mit seinem Datenmodell verdient Erwähnung: Ghostery wurde 2017 übernommen und hat seitdem den Eigentümer gewechselt. Die aktuelle Version wird hauptsächlich durch ihr Premium-Abo finanziert und verkauft keine Nutzerdaten, aber besonders datenschutzbewusste Nutzer sollten die aktuelle Datenschutzrichtlinie vor der Installation prüfen."
      - generic [ref=f6e168]:
